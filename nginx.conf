server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    # Service worker: no HTTP caching so the browser always fetches the latest version.
    # If nginx or a CDN caches sw.js, the SW never updates and offline breaks.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Workbox runtime chunks (content-hashed names, but be safe)
    location ~* workbox- {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # HTML pages: always revalidate so the SW update cycle works correctly
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite-hashed assets (JS, CSS, images, fonts): safe to cache for 1 year
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Audio files: cache for 1 day (large files, rarely change)
    location ~* \.mp3$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # All routes: try exact file, then directory index, then 404
    # Astro static output with trailingSlash:'always' generates tappa/1/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
