server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    # Security headers (defense in depth: la CSP è nel <meta> di Layout.astro,
    # che però non può esprimere frame-ancestors → clickjacking coperto qui).
    # NB nginx: add_header NON viene ereditato nelle location che definiscono
    # altri add_header (es. Cache-Control), quindi è ripetuto in ogni blocco.

    # Service worker: no HTTP caching so the browser always fetches the latest version.
    # If nginx or a CDN caches sw.js, the SW never updates and offline breaks.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Workbox runtime chunks (content-hashed names, but be safe)
    location ~* workbox- {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Vite-hashed assets (JS, CSS, images, fonts): safe to cache for 1 year
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Audio files: cache for 1 day (large files, rarely change)
    location ~* \.mp3$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Pagine e manifest: con trailingSlash 'always' gli URL reali sono directory
    # (/, /tappa/1/, /privacy/) e arrivano QUI, non a una regex su ".html".
    # Sempre revalidate, così il ciclo di update del service worker funziona.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
